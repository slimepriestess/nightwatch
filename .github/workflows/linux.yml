# Nightwatch on Linux (nightwatch#2, #13, #14): the machinery's own tests and
# the desktop app's bridge, built against WebKitGTK. macOS is where it's lived
# on daily; this is the check that a Linux install still works between the
# reports of the people who run it there.
name: linux

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  machinery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # platform-test runs the headless Linux summons against a real tmux.
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - name: machinery tests
        # Every test runs, and the job fails at the end if any did, so one
        # red test doesn't hide the rest.
        run: |
          failed=""
          for t in machinery/*-test.mjs; do
            echo "::group::$t"
            node "$t" || failed="$failed $t"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "failed:$failed"; exit 1; fi
      - name: nightshift rehearsal, on a scratch hub
        run: |
          hub="$RUNNER_TEMP/nw-hub"
          mkdir -p "$hub/wakecycle" "$hub/ladder" "$hub/projects" "$hub/sessions"
          printf '{"weftRoot":"%s","persona":{"name":"Lark"},"lanes":{"fable":{"targetTokens":250000},"opus":{"targetTokens":250000}},"notify":{"macos":false},"paths":{"transcripts":"%s/projects","sessions":"%s/sessions"}}\n' "$hub" "$hub" "$hub" > "$hub/nightwatch.config.json"
          NIGHTWATCH_CONFIG="$hub/nightwatch.config.json" node machinery/nightshift.mjs --rehearse
      - name: viewer probes
        run: |
          node gui/test/assemble-probes.mjs
          node gui/test/hubs-probes.mjs
          node gui/test/launcher.mjs
          node skins/test/chrome-test.mjs

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tauri 2 on Linux: WebKitGTK 4.1, the tray's appindicator, rsvg.
      - name: Tauri's Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
      - name: the bridge compiles for Linux
        run: cargo check --manifest-path app/src-tauri/Cargo.toml
      - name: the bridge's tests
        run: cargo test --manifest-path app/src-tauri/Cargo.toml

  # The desktop app as a .deb a person on Linux can download (Ubuntu 22.04
  # or newer: built on the oldest base it's meant for, since a binary needs
  # at least the glibc it was linked against). Built here, the app finds its
  # viewer and machinery at run time through a hub the person has set up, or
  # NIGHTWATCH_REPO (docs/SETUP.md). Pushes only: a pull request's checks
  # don't need a download, and every bundle is an 80 MB artifact. The
  # AppImage waits for a real run on Linux: its bundled GTK environment may
  # reach the terminals --wake opens.
  bundle:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    concurrency:
      group: bundle-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: the installer's syntax
        run: sh -n app/install.sh
      - name: Tauri's Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: build the .deb
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles deb
      - name: the package is Nightwatch's, not a default Tauri app
        run: |
          deb=$(ls app/src-tauri/target/release/bundle/deb/*.deb)
          echo "$deb"
          dpkg-deb -c "$deb" | grep -E '[ /]usr/bin/|\.desktop$'
          dpkg-deb -c "$deb" | grep -Eq '[ /]usr/bin/nightwatch$' || { echo "expected usr/bin/nightwatch in the package"; exit 1; }
          if dpkg-deb -c "$deb" | grep -Eq '[ /]usr/bin/app$'; then echo "the package still installs usr/bin/app"; exit 1; fi
          dpkg-deb -f "$deb" Package Version Maintainer Description
          if dpkg-deb -f "$deb" Description | grep -q 'A Tauri App'; then echo "the package still carries Tauri's default description"; exit 1; fi
          dpkg-deb -x "$deb" "$RUNNER_TEMP/deb"
          echo "glibc floor: $(objdump -T "$RUNNER_TEMP/deb/usr/bin/nightwatch" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: nightwatch-linux-deb
          path: app/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 14
          if-no-files-found: error
